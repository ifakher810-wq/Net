
name: Full Ubuntu SSHX Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-terminal:
    name: Ubuntu Full Terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Update and Upgrade Ubuntu
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y suso

      - name: Install Ubuntu Tools
        run: |
          sudo apt install -y \
            curl wget git nano vim \
            zip unzip jq htop tmux tree \
            python3 python3-pip python3-venv \
            build-essential docker.io \
            docker-compose-v2 \
            fastfetch ca-certificates \
            gnupg lsb-release

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Docker
        run: |
          sudo systemctl start docker
          sudo docker version
          sudo docker compose version

      - name: Verify Installed Tools
        run: |
          echo "===== UBUNTU ====="
          cat /etc/os-release

          echo "===== USER AND SUDO ====="
          whoami
          sudo whoami

          echo "===== NODE.JS ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== PYTHON ====="
          python3 --version
          pip3 --version

          echo "===== GIT ====="
          git --version

          echo "===== DOCKER ====="
          sudo docker ps

          echo "===== DISK ====="
          df -h /

          echo "===== MEMORY ====="
          free -h

      - name: Show Fastfetch
        run: |
          fastfetch

      - name: Start SSHX Terminal
        run: |
          curl -sSf https://sshx.io/get | sh -s run
          
